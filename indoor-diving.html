<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>실내다이빙 - SNORKY</title>
  <link rel="icon" href="./public/images/snorky-symbol.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./public/css/indoor-diving.css?v=20260904_v3">
  <link rel="stylesheet" href="./public/css/bottom-nav.css?v=20260903_v1">
  <script src="./public/js/bottom-nav.js?v=20260903_v1"></script>
</head>
<body>
  <div class="indoor-app">
    <!-- 1. 상단 헤더 -->
    <header class="indoor-header">
      <a href="./index.html" class="indoor-back-btn" aria-label="홈으로 돌아가기">‹</a>
      <h1 class="indoor-header-title">실내다이빙</h1>
      <div class="indoor-header-dummy"></div>
    </header>

    <!-- 2. 본문 컨텐츠 -->
    <main class="indoor-content">
      <!-- 인트로 배너 -->
      <section class="indoor-hero-card" aria-label="실내다이빙 안내">
        <div class="indoor-hero-text">
          <h2>전국 실내 다이빙풀 검색</h2>
          <p>날씨와 계절 걱정 없이 딥다이빙을 즐겨보세요</p>
        </div>
        <div class="indoor-hero-icon" aria-hidden="true">🏊‍♂️</div>
      </section>

      <!-- 상단 검색창 -->
      <div class="indoor-search-anchor">
        <div class="indoor-search-box">
          <span class="material-symbols-outlined indoor-search-icon">search</span>
          <input type="text" id="indoorSearchInput" class="indoor-search-input" placeholder="센터명, 지역명을 검색해보세요" aria-label="센터 검색">
          <button type="button" id="indoorSearchClear" class="indoor-search-clear" aria-label="검색어 지우기">✕</button>
        </div>
      </div>

      <!-- 2단계 검색 필터 영역 -->
      <section class="indoor-filter-container" aria-label="검색 필터">
        <!-- 1행: 지역 / 수심 / 편의시설 탭 버튼 -->
        <div class="indoor-search-tabs" role="tablist" aria-label="필터 항목">
          <button type="button" class="indoor-search-tab" id="tabRegion" data-tab="region" aria-expanded="false">
            <span class="indoor-tab-label">지역</span>
          </button>
          <button type="button" class="indoor-search-tab" id="tabDepth" data-tab="depth" aria-expanded="false">
            <span class="indoor-tab-label">수심</span>
          </button>
          <button type="button" class="indoor-search-tab" id="tabFacility" data-tab="facility" aria-expanded="false">
            <span class="indoor-tab-label">편의시설</span>
          </button>
        </div>

        <!-- 드롭다운/확장 패널들 -->
        <div class="indoor-filter-panels" id="indoorFilterPanels">
          <!-- 1. 지역 선택 패널 -->
          <div class="indoor-filter-panel" id="panelRegion" data-panel="region" hidden>
            <div class="indoor-panel-head">
              <strong>지역 선택</strong>
              <button type="button" class="indoor-panel-close" aria-label="지역 패널 닫기">×</button>
            </div>
            <div class="indoor-search-options" id="indoorRegionOptions"></div>
            <div class="indoor-subregion-block" id="indoorSubRegionBlock" hidden>
              <span class="indoor-subregion-head">세부지역</span>
              <div class="indoor-search-options" id="indoorSubRegionOptions"></div>
            </div>
          </div>

          <!-- 2. 수심 선택 패널 -->
          <div class="indoor-filter-panel" id="panelDepth" data-panel="depth" hidden>
            <div class="indoor-panel-head">
              <strong>수심 선택</strong>
              <button type="button" class="indoor-panel-close" aria-label="수심 패널 닫기">×</button>
            </div>
            <div class="indoor-search-options" id="indoorDepthOptions"></div>
          </div>

          <!-- 3. 편의시설 선택 패널 -->
          <div class="indoor-filter-panel" id="panelFacility" data-panel="facility" hidden>
            <div class="indoor-panel-head">
              <strong>편의시설 선택</strong>
              <button type="button" class="indoor-panel-close" aria-label="편의시설 패널 닫기">×</button>
            </div>
            <div class="indoor-search-options" id="indoorFacilityOptions"></div>
          </div>
        </div>

        <!-- 선택 조건 요약 칩 + 초기화 버튼 -->
        <div class="indoor-search-summary" id="indoorSearchSummary" hidden>
          <div class="indoor-summary-chips" id="indoorSummaryChips"></div>
          <button type="button" id="indoorResetBtn" class="indoor-summary-reset" aria-label="필터 초기화">
            <span class="material-symbols-outlined" style="font-size:12px;">refresh</span>
            <span>초기화</span>
          </button>
        </div>

        <!-- 2행: 검색 버튼 -->
        <button type="button" id="indoorSearchSubmit" class="indoor-search-submit">
          검색
        </button>
      </section>

      <!-- 검색 결과 헤더 -->
      <div class="indoor-results-header">
        <span class="indoor-results-count">총 <strong id="indoorCount">0</strong>개 센터</span>
        <select id="indoorSortSelect" class="indoor-sort-select" aria-label="정렬 방식">
          <option value="depth">수심 깊은순</option>
          <option value="name">센터 이름순</option>
        </select>
      </div>

      <!-- 센터 카드 목록 -->
      <section class="indoor-cards-grid" id="indoorCardsGrid" aria-label="다이빙 센터 목록">
        <!-- 동적 생성 -->
      </section>

      <!-- 검색 결과 없음 상태 -->
      <div class="indoor-empty-state" id="indoorEmptyState">
        <span class="material-symbols-outlined indoor-empty-icon">search_off</span>
        <h3 class="indoor-empty-title">조건에 맞는 다이빙 센터가 없습니다</h3>
        <p class="indoor-empty-desc">필터 조건을 변경하거나 검색어를 다시 입력해보세요.</p>
      </div>
    </main>

    <!-- 3. 센터 상세 모달 (슬라이드업 바텀시트) -->
    <div class="indoor-modal-overlay" id="indoorDetailModal" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <div class="indoor-modal-sheet">
        <!-- 1. 상단 미디어 & 타이틀 -->
        <div class="indoor-modal-media">
          <img id="modalImg" class="indoor-modal-img" src="" alt="센터 사진">
          <button type="button" id="modalCloseBtn" class="indoor-modal-close-btn" aria-label="닫기">✕</button>
          <div class="indoor-modal-media-overlay">
            <div class="indoor-modal-media-text">
              <h3 id="modalName">센터명</h3>
              <span id="modalRegion">지역 정보</span>
            </div>
            <span id="modalStatus" class="indoor-status-badge">운영중</span>
          </div>
        </div>

        <!-- 2. 요약 탭 4개 (모바일 2열 압축 배치) -->
        <div class="indoor-detail-tabs-bar" role="tablist" aria-label="주요 요약 정보">
          <button type="button" class="indoor-detail-tab" data-target-section="sectionHours" aria-label="운영시간 확인">
            <span class="indoor-detail-tab-label">운영시간</span>
            <span id="modalTabHours" class="indoor-detail-tab-val">-</span>
          </button>
          <button type="button" class="indoor-detail-tab" data-target-section="sectionHoliday" aria-label="휴무일 확인">
            <span class="indoor-detail-tab-label">휴무일</span>
            <span id="modalTabHoliday" class="indoor-detail-tab-val">-</span>
          </button>
          <button type="button" class="indoor-detail-tab" data-target-section="sectionBuddy" aria-label="버디조건 확인">
            <span class="indoor-detail-tab-label">버디조건</span>
            <span id="modalTabBuddy" class="indoor-detail-tab-val">-</span>
          </button>
          <button type="button" class="indoor-detail-tab" data-target-section="sectionPool" aria-label="최대수심 확인">
            <span class="indoor-detail-tab-label">최대수심</span>
            <span id="modalTabDepth" class="indoor-detail-tab-val highlight">-</span>
          </button>
        </div>

        <!-- 모달 바디 스크롤 -->
        <div class="indoor-modal-body" id="indoorModalBody">
          <!-- 1. 기본 핵심 운영/위치 정보 카드 (중복 없는 기본 안내) -->
          <section class="indoor-detail-section" id="sectionBasicInfo">
            <div class="indoor-detail-rows">
              <div class="indoor-detail-row" id="sectionHours">
                <span class="indoor-row-label">운영시간</span>
                <span id="modalHours" class="indoor-row-val">-</span>
              </div>
              <div class="indoor-detail-row" id="sectionHoliday">
                <span class="indoor-row-label">정기휴무</span>
                <span id="modalHoliday" class="indoor-row-val">-</span>
              </div>
              <div class="indoor-detail-row" id="sectionAddress">
                <span class="indoor-row-label">센터주소</span>
                <div class="indoor-row-val indoor-address-box">
                  <span id="modalAddress">-</span>
                  <button type="button" id="modalCopyAddressBtn" class="indoor-copy-btn">복사</button>
                </div>
              </div>
              <div class="indoor-detail-row" id="sectionParking">
                <span class="indoor-row-label">주차안내</span>
                <span id="modalParkingDetail" class="indoor-row-val">-</span>
              </div>
              <div class="indoor-detail-row" id="sectionPhone">
                <span class="indoor-row-label">문의전화</span>
                <span id="modalPhone" class="indoor-row-val">-</span>
              </div>
              <div class="indoor-detail-row" id="sectionHomepage">
                <span class="indoor-row-label">홈페이지</span>
                <a id="modalHomepageLink" class="indoor-row-val indoor-link-text" href="#" target="_blank" rel="noopener noreferrer">-</a>
              </div>
            </div>
          </section>

          <!-- 2. 상세정보 1: 시설 특징 (더보기 구조) -->
          <section class="indoor-detail-section" id="sectionFeatures">
            <header class="indoor-detail-section-header">
              <span class="indoor-section-badge">시설 특징</span>
              <button type="button" class="indoor-toggle-more" data-target="featuresContent" aria-expanded="false">
                <span>더보기</span> ›
              </button>
            </header>
            <div class="indoor-summary-preview">
              <p id="modalFeatureShort" class="indoor-preview-text">-</p>
            </div>
            <div class="indoor-foldable-content" id="featuresContent" hidden>
              <div class="indoor-detail-rows">
                <div class="indoor-detail-row" id="sectionBuddy">
                  <span class="indoor-row-label">버디규정</span>
                  <span id="modalBuddyDetail" class="indoor-row-val">-</span>
                </div>
                <div class="indoor-detail-row">
                  <span class="indoor-row-label">상세설명</span>
                  <span id="modalFeatureFull" class="indoor-row-val">-</span>
                </div>
              </div>
            </div>
          </section>

          <!-- 3. 상세정보 2: 시설 정보 & 풀규격 (더보기 구조) -->
          <section class="indoor-detail-section" id="sectionFacility">
            <header class="indoor-detail-section-header">
              <span class="indoor-section-badge">시설 정보</span>
              <button type="button" class="indoor-toggle-more" data-target="facilityContent" aria-expanded="false">
                <span>더보기</span> ›
              </button>
            </header>
            <div class="indoor-summary-preview">
              <p id="modalFacilityShort" class="indoor-preview-text">-</p>
            </div>
            <div class="indoor-foldable-content" id="facilityContent" hidden>
              <div class="indoor-detail-rows">
                <div class="indoor-detail-row" id="sectionPool">
                  <span class="indoor-row-label">풀규격</span>
                  <span id="modalPoolSpecs" class="indoor-row-val">-</span>
                </div>
                <div class="indoor-detail-row">
                  <span class="indoor-row-label">수온유지</span>
                  <span id="modalPoolTemp" class="indoor-row-val">-</span>
                </div>
                <div class="indoor-detail-row">
                  <span class="indoor-row-label">부대시설</span>
                  <span id="modalFacilitiesFull" class="indoor-row-val">-</span>
                </div>
              </div>
            </div>
          </section>

          <!-- 4. 상세정보 3: 이용요금 & 예약안내 (더보기 구조) -->
          <section class="indoor-detail-section" id="sectionPrice">
            <header class="indoor-detail-section-header">
              <span class="indoor-section-badge">이용요금</span>
              <button type="button" class="indoor-toggle-more" data-target="priceContent" aria-expanded="false">
                <span>더보기</span> ›
              </button>
            </header>
            <div class="indoor-summary-preview">
              <p id="modalPriceShort" class="indoor-preview-text">-</p>
            </div>
            <div class="indoor-foldable-content" id="priceContent" hidden>
              <div class="indoor-detail-rows">
                <div class="indoor-detail-row">
                  <span class="indoor-row-label">입장요금</span>
                  <span id="modalPriceFull" class="indoor-row-val">-</span>
                </div>
                <div class="indoor-detail-row">
                  <span class="indoor-row-label">장비대여</span>
                  <span id="modalRentalInfo" class="indoor-row-val">-</span>
                </div>
                <div class="indoor-detail-row">
                  <span class="indoor-row-label">예약방식</span>
                  <span id="modalReservationInfo" class="indoor-row-val">-</span>
                </div>
              </div>
            </div>
          </section>
        </div>

        <!-- 5. 하단 액션 버튼 (바로가기 3개 + 최하단 버디구하기 강조) -->
        <footer class="indoor-modal-footer">
          <!-- 1행: 길찾기 / 홈페이지 / 전화하기 -->
          <div class="indoor-quick-actions-row">
            <button type="button" id="modalNavBtn" class="indoor-action-btn">
              <span class="material-symbols-outlined">directions</span>
              <span>길찾기</span>
            </button>
            <button type="button" id="modalHomepageBtn" class="indoor-action-btn">
              <span class="material-symbols-outlined">language</span>
              <span>홈페이지</span>
            </button>
            <button type="button" id="modalCallBtn" class="indoor-action-btn">
              <span class="material-symbols-outlined">call</span>
              <span>전화하기</span>
            </button>
          </div>

          <!-- 2행: 가장 아래 메인 CTA 버디구하기 강조 -->
          <button type="button" id="modalBuddyCtaBtn" class="indoor-buddy-cta-btn">
            <span>🤝 함께할 버디구하기</span>
          </button>
        </footer>
      </div>
    </div>

    <!-- 4. 토스트 메시지 -->
    <div id="indoorToast" class="indoor-toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./public/js/indoor-diving.js?v=20260904_v3"></script>
</body>
</html>
