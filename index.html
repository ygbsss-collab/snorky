(()=>{const intro=document.getElementById('snorkyIntro');if(!intro||document.documentElement.classList.contains('snorky-intro-seen')){intro?.remove();return}const video=document.getElementById('snorkyIntroVideo'),key='snorky_intro_seen',body=document.body,previousOverflow=body.style.overflow,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let closed=false,failSafe;body.style.overflow='hidden';const closeIntro=()=>{if(closed)return;closed=true;clearTimeout(failSafe);video.pause();try{sessionStorage.setItem(key,'1')}catch(e){console.warn('[SNORKY intro] sessionStorage unavailable',e)}intro.classList.add('is-leaving');body.style.overflow=previousOverflow;setTimeout(()=>intro.remove(),reduce?220:420)};document.getElementById('snorkyIntroSkip').addEventListener('click',closeIntro);video.addEventListener('ended',closeIntro,{once:true});video.addEventListener('error',closeIntro,{once:true});video.addEventListener('loadeddata',()=>video.classList.add('is-ready'),{once:true});video.addEventListener('loadedmetadata',()=>{clearTimeout(failSafe);const duration=Number.isFinite(video.duration)?video.duration:7;failSafe=setTimeout(closeIntro,Math.min(10000,(duration+3)*1000))},{once:true});if(reduce){setTimeout(closeIntro,200);return}video.src=matchMedia('(max-width: 680px)').matches?'./public/videos/snorky-intro-mobile.mp4':'./public/videos/snorky-intro-wide.mp4';failSafe=setTimeout(closeIntro,10000);const playback=video.play();if(playback)playback.catch(()=>setTimeout(closeIntro,250))})();

<script>
if ('serviceWorker' in navigator) {
  const isLocalhost = Boolean(
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||
    window.location.hostname === '[::1]' ||
    window.location.hostname.endsWith('.localhost')
  );

  if (isLocalhost) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (const registration of registrations) {
        registration.unregister().catch(err => console.warn('[SNORKY PWA] unregister error', err));
      }
    }).catch(error => console.warn('[SNORKY PWA] getRegistrations error', error));

    if ('caches' in window) {
      caches.keys().then(keys => {
        for (const key of keys) {
          caches.delete(key).catch(err => console.warn('[SNORKY PWA] cache delete error', err));
        }
      }).catch(error => console.warn('[SNORKY PWA] cache keys error', error));
    }
  } else {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .catch(error => console.warn('[SNORKY PWA] Service Worker registration failed', error));
    });
  }
}
